variables:
  PACKAGE_DIR: "vortex-nwp"

include: "/ci/templates.yml"

format:
  script:
    - pip install ruff==0.9.*
    # Don't check formatting for test code yet
    - ruff format --check ${PACKAGE_DIR}/src

lint:
  script:
    - pip install ruff==0.9.*
    # Don't check test code yet
    - ruff check ${PACKAGE_DIR}/src

run-tests:
  stage: test
  image: "python:3.12-slim"
  before_script:
    - pip install ${PACKAGE_DIR}/[dev]
  script:
    - cd ${PACKAGE_DIR} && pytest tests/test_config.py tests/tests_algo/test_basics.py tests/test_ecflow.py tests/test_geometries.py tests/test_user_remote_dtree.py tests/test_namespaces.py

make-release:
  variables:
    TWINE_REPOSITORY_URL: "https://test.pypi.org/legacy/"
    TWINE_USERNAME: "__token__"
    TWINE_PASSWORD: "$TESTPYPI_TOKEN"
    TWINE_CERT: "$MF_CA_PEM"
